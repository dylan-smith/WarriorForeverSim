name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Nightly run of the full pipeline, including CodeQL, so new security queries are
  # applied to main even without pushes.
  schedule:
    - cron: "0 6 * * *"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore WarriorForeverSim.sln
      working-directory: src

    # Fails if any file would be changed by `dotnet format`, i.e. if any formatting,
    # code-style, or naming rule in .editorconfig at warning severity or above is
    # violated. Run `dotnet format WarriorForeverSim.sln` locally to fix.
    - name: Check code style
      run: dotnet format WarriorForeverSim.sln --no-restore --verify-no-changes --severity warn
      working-directory: src

  web:
    name: Web UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install
      run: npm ci

    - name: Lint
      run: npm run lint

    # Type-checks (tsc -b) and bundles into src/WarriorForeverSim.Api/wwwroot.
    - name: Build
      run: npm run build

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
      security-events: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore WarriorForeverSim.sln
      working-directory: src

    # CodeQL traces the build below to extract the C# code, so the project only needs
    # to be compiled once for both testing and scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp
        build-mode: manual
        queries: security-and-quality

    - name: Build
      run: dotnet build WarriorForeverSim.sln --configuration Release --no-restore
      working-directory: src

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:csharp

    - name: Test
      id: test
      run: >
        dotnet test WarriorForeverSim.sln
        --configuration Release
        --no-build
        --logger "trx;LogFileName=test-results.trx"
        --results-directory ../test-results
        --collect:"XPlat Code Coverage"
      working-directory: src

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
      if: always()
      with:
        check_name: Unit Test Results
        files: test-results/**/*.trx

    # Converts the Cobertura XML written by the coverlet collector during the Test step
    # into a JSON summary (rendered as markdown by the next step) and a browsable HTML
    # report (uploaded as an artifact).
    # The glob is one level deep on purpose: coverlet also leaves a copy of the file in a
    # per-host subfolder, and ** would load both.
    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
      if: always() && steps.test.outcome != 'skipped'
      with:
        reports: test-results/*/coverage.cobertura.xml
        targetdir: coverage-report
        reporttypes: JsonSummary;Html
        title: Code Coverage

    - name: Build coverage comment
      if: always() && steps.test.outcome != 'skipped'
      run: jq -r -f .github/scripts/coverage-comment.jq coverage-report/Summary.json > coverage-report/comment.md

    - name: Publish coverage summary
      if: always() && steps.test.outcome != 'skipped'
      run: cat coverage-report/comment.md >> "$GITHUB_STEP_SUMMARY"

    # Sticky comment: one comment per PR, updated in place on every push instead of
    # adding a new one. Skipped for fork PRs, which get a read-only token.
    - name: Comment coverage on PR
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: >
        always() && steps.test.outcome != 'skipped'
        && github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
      with:
        header: code-coverage
        path: coverage-report/comment.md

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v7
      if: always() && steps.test.outcome != 'skipped'
      with:
        name: coverage-report
        path: coverage-report/

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: test-results/

  # Scans the workflow files under .github/workflows themselves. No build is needed.
  codeql-actions:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
    - uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: actions
        build-mode: none
        queries: security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:actions
