name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Nightly run of the full pipeline, including CodeQL, so new security queries are
  # applied to main even without pushes.
  schedule:
    - cron: "0 6 * * *"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore WarriorForeverSim.sln
      working-directory: src

    # Fails if any file would be changed by `dotnet format`, i.e. if any formatting,
    # code-style, or naming rule in .editorconfig at warning severity or above is
    # violated. Run `dotnet format WarriorForeverSim.sln` locally to fix.
    - name: Check code style
      run: dotnet format WarriorForeverSim.sln --no-restore --verify-no-changes --severity warn
      working-directory: src

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore WarriorForeverSim.sln
      working-directory: src

    - name: Build
      run: dotnet build WarriorForeverSim.sln --configuration Release --no-restore
      working-directory: src

    - name: Test
      run: >
        dotnet test WarriorForeverSim.sln
        --configuration Release
        --no-build
        --logger "trx;LogFileName=test-results.trx"
        --results-directory ../test-results
        --collect:"XPlat Code Coverage"
      working-directory: src

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        check_name: Unit Test Results
        files: test-results/**/*.trx

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: test-results/

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
        # The C# project targets net10.0, so it is built explicitly with the same SDK the
        # other jobs use rather than relying on CodeQL's bundled .NET.
        - language: csharp
          build-mode: manual
        # Scans the workflow files under .github/workflows themselves.
        - language: actions
          build-mode: none

    steps:
    - uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality

    - name: Setup .NET
      if: matrix.build-mode == 'manual'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      if: matrix.build-mode == 'manual'
      run: dotnet restore WarriorForeverSim.sln
      working-directory: src

    - name: Build
      if: matrix.build-mode == 'manual'
      run: dotnet build WarriorForeverSim.sln --configuration Release --no-restore
      working-directory: src

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:${{ matrix.language }}
