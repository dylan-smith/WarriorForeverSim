name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The projects target netcoreapp3.1, which is end of life and cannot run on
  # current Ubuntu runners (no libssl 1.1). Roll forward so the test host runs
  # on the installed .NET 10 runtime instead.
  DOTNET_ROLL_FORWARD: Major

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore WarriorForeverSim.sln
      working-directory: src

    - name: Build
      run: dotnet build WarriorForeverSim.sln --configuration Release --no-restore
      working-directory: src

    - name: Test
      run: >
        dotnet test WarriorForeverSim.sln
        --configuration Release
        --no-build
        --logger "trx;LogFileName=test-results.trx"
        --results-directory ../test-results
        --collect:"XPlat Code Coverage"
      working-directory: src

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        check_name: Unit Test Results
        files: test-results/**/*.trx

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: test-results/
