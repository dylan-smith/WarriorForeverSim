# Dependabot configuration.
# Goal: keep every dependency on its latest released version.
# - No `ignore` rules, so major version bumps are proposed too.
# - Updates are grouped into one PR per ecosystem so a single merge brings everything current.
# - Checked daily so new releases are picked up quickly.
version: 2

updates:
  # NuGet packages referenced by the projects in src/WarriorForeverSim.sln
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - nuget
    groups:
      nuget-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
